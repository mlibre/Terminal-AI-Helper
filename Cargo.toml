[package]
name = "tai"
version = "3.2.5"
edition = "2021"
description = "Terminal AI Helper — learns the commands you run and suggests them as you type"
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
libc = "0.2"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
