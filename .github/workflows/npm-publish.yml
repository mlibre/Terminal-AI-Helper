# The manual door for the npm publish. The automatic one lives inside the
# release workflow — a tag pushed by GITHUB_TOKEN starts no other workflow, so
# a `push: tags` trigger here would never fire for the tags that workflow cuts.
# Dispatch publishes whatever VERSION says, with the same no-op guard: a
# version already on the registry goes green without shipping again.
name: npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Publish (a no-op when this version is already out)
        run: |
          set -e
          version="$(tr -d '[:space:]' < VERSION)"
          if npm view "terminal-ai-helper@$version" version >/dev/null 2>&1; then
            echo "terminal-ai-helper@$version is already on the registry — nothing to do"
            exit 0
          fi
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
