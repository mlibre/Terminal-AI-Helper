# Build a real GitHub release for every commit landed on the default branch.
#
# One main branch drives everything: each push that turns green gets its own
# tag and a GitHub release marking the tree it shipped from. Tests run first;
# a red tree never becomes a release. The tag comes from the VERSION file at
# the repo root — `v1.0.0`, not a date-with-a-hash — and when the same version
# ships more than once, a build number is appended (`v1.0.0-2`), so a push is
# never held up by a tag that already exists. Every release carries a ready to
# install .deb built from exactly the tree that passed the tests.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write   # needed for git tag + release object

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tag dedup compares against existing tags

      - name: Install shells
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run all test suites
        run: tests/test.sh

      - name: Build the .deb package
        run: scripts/build_deb.sh

      - name: Create and push tag
        id: tag
        run: |
          set -e
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            n=$((n+1)); tag="v$version-$n"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git tag "$tag"
          git push origin "$tag"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "${{ steps.tag.outputs.tag }}"
          files: dist/*.deb
          generate_release_notes: true

  # The registry rides the same green tree the tag marks. It lives inside this
  # workflow rather than behind a `push: tags` trigger of its own because a tag
  # pushed by GITHUB_TOKEN starts no other workflow — the recursion guard — so
  # a tag-only trigger would never fire for the tags this workflow cuts. The
  # publish is a no-op when the version is already out, which is exactly what
  # the build-number tags are: v1.3.1-2 carries a VERSION that is already on
  # the registry, and the job goes green without pretending it shipped again.
  npm-publish:
    runs-on: ubuntu-latest
    needs: test-and-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Publish (a no-op when this version is already out)
        run: |
          set -e
          version="$(tr -d '[:space:]' < VERSION)"
          if npm view "terminal-ai-helper@$version" version >/dev/null 2>&1; then
            echo "terminal-ai-helper@$version is already on the registry — nothing to do"
            exit 0
          fi
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
